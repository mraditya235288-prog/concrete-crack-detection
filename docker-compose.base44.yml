services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-placeholder}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
      apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 &&
      pip install --no-cache-dir -r requirements.txt &&
      python app.py
      "
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
